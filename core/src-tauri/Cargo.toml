[package]
name = "kt_iot_hub"
version = "0.4.1"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Async trait support
async-trait = "0.1"

# Web framework & IPC
tauri = { version = "2.1", features = [] }
tauri-plugin-opener = "2.1"
tauri-plugin-dialog = "2.1"

# Config & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database drivers
tokio-postgres = "0.7"
postgres-types = { version = "0.2", features = ["derive"] }

# MQTT client
rumqttc = "0.25"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# gRPC
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Other utilities
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
kt_driver_ui_protocol = { path = "../../packages/protocol-rs" }
kt_driver_ui_host = { path = "../../packages/driver-ui-host" }

[dev-dependencies]
tokio-test = "0.4"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
tonic-build = "0.12"
protoc-bin-vendored = "3"

