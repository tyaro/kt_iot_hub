[package]
name = "joywatcher-bridge-x86"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "joywatcher-bridge-x86"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
