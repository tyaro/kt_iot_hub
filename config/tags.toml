# Tags Configuration
# tags.toml - スキャングループ定義とタグ定義
#
# 構造:
#   [[scan_group]] - ドライバ接続 + テーブル/デバイス単位の周期設定
#   [[tag]]        - スキャングループに属するタグ（読み出す列/アドレス）

# ─────────────────────────────────────────
# スキャングループ (PostgreSQL)
# テーブル毎に周期を設定する
# ─────────────────────────────────────────

[[scan_group]]
id             = "sensors-fast"
driver         = "postgres-main"
table          = "sensors"
timestamp_column = "measured_at"
scan_rate_ms   = 1000            # PV 系: 1秒周期

[[scan_group]]
id             = "system-slow"
driver         = "postgres-main"
table          = "system_status"
timestamp_column = "updated_at"
scan_rate_ms   = 5000            # 設定値/ステータス系: 5秒周期

# ─────────────────────────────────────────
# タグ定義
# driver_spec にドライバ固有の読み出し情報を記載する
# ─────────────────────────────────────────

[[tag]]
id          = "tag-0001"
name        = "Line 1 Temperature"
data_type   = "f32"
driver      = "postgres-main"
scan_group  = "sensors-fast"
driver_spec = { value_column = "temperature" }

[[tag]]
id          = "tag-0002"
name        = "Line 1 Pressure"
data_type   = "f64"
driver      = "postgres-main"
scan_group  = "sensors-fast"
driver_spec = { value_column = "pressure" }

[[tag]]
id          = "tag-0003"
name        = "System Status"
data_type   = "string"
driver      = "postgres-main"
scan_group  = "system-slow"
driver_spec = { value_column = "status" }
