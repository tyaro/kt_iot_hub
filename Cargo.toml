[workspace]
resolver = "2"
members = [
  "core/src-tauri",
  "packages/protocol-rs",
  "packages/driver-ui-host",
  "drivers/postgres/ui",
  "drivers/postgres/driver",
  "drivers/joywatcher/ui",
  "drivers/joywatcher/driver",
  "drivers/joywatcher/bridge-x86",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
